services:
  job-tracker:
    build: .
    container_name: job-tracker
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - APP_PASSWORD=${APP_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@job-tracker-db:5432/${POSTGRES_DB}
      - LBA_API_KEY=${LBA_API_KEY}
      - N8N_WEBHOOK_ENRICH=${N8N_WEBHOOK_ENRICH}
      - N8N_WEBHOOK_LM=${N8N_WEBHOOK_LM}
      - LM_AGENT_URL=http://langgraph-agents:8001
      - FT_CLIENT_ID=${FT_CLIENT_ID}
      - FT_CLIENT_SECRET=${FT_CLIENT_SECRET}
    depends_on:
      job-tracker-db:
        condition: service_healthy
    networks:
      - n8n_proxy-network
      - internal

  job-tracker-db:
    image: postgres:16-alpine
    container_name: job-tracker-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  langgraph-agents:
    build: ./langgraph-agents
    container_name: langgraph-agents
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@job-tracker-db:5432/${POSTGRES_DB}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - APP_PASSWORD=${APP_PASSWORD}
      - FLASK_API_URL=http://job-tracker:5000
    depends_on:
      job-tracker-db:
        condition: service_healthy
    networks:
      - internal

networks:
  n8n_proxy-network:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data: